<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Lecture - AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        form { display: inline-block; text-align: left; }
        label { display: block; margin-top: 10px; }
    </style>
</head>
<body>
<h1>Create a Lecture</h1>
{% if not user.is_authenticated %}<p>You must be logged in as an instructor to create a lecture.</p>{% endif %}
<form method="post" action="/app/createLecture">
    <label for="choice">Course</label>
    <select id="choice" name="choice" required>
        {% for course in courses %}
            <option value="{{ course.name }}">{{ course.name }}</option>
        {% empty %}
            <option value="" disabled selected>No courses yet: create one first</option>
        {% endfor %}
    </select>

    <p><input type="submit" value="Create Lecture"></p>
</form>
<p><a href="/app/new_course">New course</a> | <a href="/">Home</a></p>
</body>
</html>
