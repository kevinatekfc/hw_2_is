<!DOCTYPE html>
<html><head><title>Login</title></head>
<body style="text-align:center; font-family:Arial;">
<h1>Log In</h1>

{% if form.errors %}
    <p style="color:red;">Your user name and password didn't match. Please try again.</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <p><label for="id_username">Username:</label>
       <input type="text" name="username" id="id_username" required></p>
    <p><label for="id_password">Password:</label>
       <input type="password" name="password" id="id_password" required></p>
    <input type="hidden" name="next" value="{{ next }}">
    <p><input type="submit" value="Log In"></p>
</form>
<p><a href="/app/new">Sign Up</a></p>
</body>
</html>
